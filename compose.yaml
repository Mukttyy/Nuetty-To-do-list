services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nuetty
      POSTGRES_USER: nuetty
      POSTGRES_PASSWORD: nuetty_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuetty -d nuetty"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - nuetty_postgres_data:/var/lib/postgresql/data

volumes:
  nuetty_postgres_data:
